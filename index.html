/* ---------------------------------------------------------------
   CARPETA 3 — INFORME MENSUAL
   --------------------------------------------------------------- */
function renderInformeMensual(){
  const filas = STATE.filtered;
  const colores = estiloEjes();
  const filtrosActuales = leerFiltrosActuales();

  const entregados = filas.filter(x=>esEstadoEntregado(x.estado)).length;
  const cerradosNovedad = filas.filter(x=>esEstadoCerradoConNovedad(x.estado)).length;
  const cancelados = filas.filter(x=>esEstadoCancelado(x.estado)).length;

  crearOActualizarChart('chartEstadosMediaLuna', {
    type:'doughnut',
    data:{ labels:['Entregados','Cerrados con novedad','Cancelados'], datasets:[{ data:[entregados, cerradosNovedad, cancelados], backgroundColor:[colores.success, colores.warning, colores.danger], borderWidth:0 }] },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'65%', rotation:-90, circumference:180,
      plugins:{ legend:{ position:'bottom', labels:{ color:colores.text, boxWidth:10, font:{size:11},
        generateLabels(chart){
          const datos = chart.data.datasets[0].data;
          const total = datos.reduce((a,b)=>a+b,0) || 1;
          return chart.data.labels.map((etq,i)=>({ text:`${etq}: ${formatoNumero(datos[i])} (${(datos[i]/total*100).toFixed(1)}%)`, fillStyle:chart.data.datasets[0].backgroundColor[i], index:i }));
        }
      } } }
    }
  });

  const entregasPorPunto = agregarPor(filas.filter(x=>esEstadoEntregado(x.estado)), 'punto').sort((a,b)=>b.total-a.total);
  ajustarAlturaScroll('innerEntregasPunto', entregasPorPunto.length, 26, 320);
  crearOActualizarChart('chartEntregasPorPunto', {
    type:'bar',
    data:{ labels:entregasPorPunto.map(p=>p.nombre), datasets:[{ data:entregasPorPunto.map(p=>p.total), backgroundColor:colores.success, borderRadius:4 }] },
    plugins:[pluginEtiquetasValor],
    options: opcionesBaseChart(colores, {indexAxis:'y', plugins:{legend:{display:false}}, layout:{padding:{right:46}}})
  });

  const tiemposValidos = filas.map(x=>x.tiempo).filter(t=>t!==null && t!==undefined && !isNaN(t));
  const tiempoTotalProm = tiemposValidos.length ? tiemposValidos.reduce((a,b)=>a+b,0)/tiemposValidos.length : null;
  document.getElementById('tiempoTotalInformeMensual').textContent = formatoTiempoHM(tiempoTotalProm);

  const tiemposPorPunto = agregarPor(filas, 'punto').filter(p=>p.tiempoProm!==null).sort((a,b)=>b.tiempoProm-a.tiempoProm);
  ajustarAlturaScroll('innerTiemposPunto', tiemposPorPunto.length, 26, 260);
  crearOActualizarChart('chartTiemposPorPuntoDesc', {
    type:'bar',
    data:{ labels:tiemposPorPunto.map(p=>p.nombre), datasets:[{ data:tiemposPorPunto.map(p=>Math.round(p.tiempoProm)), backgroundColor:colores.accentStrong, borderRadius:4 }] },
    plugins:[pluginEtiquetasTiempo],
    options: opcionesBaseChart(colores, {indexAxis:'y', plugins:{legend:{display:false}}, layout:{padding:{right:56}}})
  });

  const ticketGeneral = calcularTicketPromedio(STATE.promo, filtrosActuales);
  document.getElementById('ticketPromedioInformeMensual').textContent = formatoMoneda(ticketGeneral);

  let subsetPromo = STATE.promo.filter(p=>!esPuntoAdministrativo(p.punto));
  if(filtrosActuales.ciudad && filtrosActuales.ciudad.length) subsetPromo = subsetPromo.filter(p=>coincideMultipleNormalizado(p.ciudad, filtrosActuales.ciudad));
  if(filtrosActuales.punto && filtrosActuales.punto.length) subsetPromo = subsetPromo.filter(p=>coincideMultipleNormalizado(p.punto, filtrosActuales.punto));
  subsetPromo = subsetPromo.filter(p=>mesEnRango(p.anio, p.mes, filtrosActuales.fechaIni, filtrosActuales.fechaFin));
  const porPuntoTicket = new Map();
  subsetPromo.forEach(p=>{ if(p.ticket!==null){ if(!porPuntoTicket.has(p.punto)) porPuntoTicket.set(p.punto, []); porPuntoTicket.get(p.punto).push(p.ticket); } });
  const ticketDesc = [...porPuntoTicket.entries()].map(([nombre,arr])=>({nombre, valor:Math.round(arr.reduce((a,b)=>a+b,0)/arr.length)})).sort((a,b)=>b.valor-a.valor);
  ajustarAlturaScroll('innerTicketPuntoDesc', ticketDesc.length, 26, 260);
  crearOActualizarChart('chartTicketPorPuntoDesc', {
    type:'bar',
    data:{ labels:ticketDesc.map(p=>p.nombre), datasets:[{ data:ticketDesc.map(p=>p.valor), backgroundColor:colores.accent, borderRadius:4 }] },
    plugins:[pluginEtiquetasValor],
    options: opcionesBaseChart(colores, {indexAxis:'y', plugins:{legend:{display:false}}, layout:{padding:{right:64}}})
  });
}

function renderFranja(){

        <tr>
          <td>${a.nombre}</td>
          <td class="num">${formatoNumero(a.total)}</td>
          <td class="num">${formatoPct(totalGeneral? a.total/totalGeneral*100:0)}</td>
          <td class="num">${a.tiempoProm!==null? formatoNumero(a.tiempoProm,0)+' min':'N/D'}</td>
          <td class="num">${formatoPct(a.cumplimiento)}</td>
          <td class="num">${formatoPct(a.efectividad)}</td>
          <td class="num">${formatoNumero(a.novedadesCount)}</td>
        </tr>`).join('')}
    </tbody></table>`;
}

function listaRankingHTML(items, maxItems=8, formato='numero'){
  const top = items.slice(0, maxItems);
  const max = Math.max(...top.map(i=>i.valor), 1);
  if(!top.length) return `<div class="empty-note">Sin datos.</div>`;
  return top.map((i,idx)=>`
    <div class="rank-row">
      <div class="rank-pos">${String(idx+1).padStart(2,'0')}</div>
      <div>
        <div class="rank-name" title="${i.nombre}">${i.nombre}</div>
        <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${(i.valor/max*100)}%;"></div></div>
      </div>
      <div class="rank-value">${formato==='moneda'?formatoMoneda(i.valor):(formato==='pct'?formatoPct(i.valor):formatoNumero(i.valor))}</div>
    </div>`).join('');
}

  crearOActualizarChart('chartNovPunto', {
    type:'bar',
    data:{ labels:porPunto.map(p=>p.nombre), datasets:[{ label:'Novedades', data:porPunto.map(p=>p.total), backgroundColor:colores.danger, borderRadius:4 }] },
    options: opcionesBaseChart(colores, {indexAxis:'y', plugins:{legend:{display:false}}})
  });

  // Novedades por ciudad: mismo criterio, agrupado por ciudad.
  const porCiudad = agregarPor(filas, 'ciudad').sort((a,b)=>b.total-a.total).slice(0,10);
  crearOActualizarChart('chartNovCiudad', {
    type:'bar',
    data:{ labels:porCiudad.map(c=>c.nombre), datasets:[{ label:'Novedades', data:porCiudad.map(c=>c.total), backgroundColor:colores.warning, borderRadius:4 }] },
    options: opcionesBaseChart(colores, {indexAxis:'y', plugins:{legend:{display:false}}})
  });
}

/* ---------------------------------------------------------------
   16C. RENDER — MÓDULO 8: PEDIDOS SIN CUMPLIMIENTO DE ENTREGA
   (columnas reales "Novedad Cumplimiento" y "Responsable" -causa raíz-)
   --------------------------------------------------------------- */
function renderPedidosSinCumplimiento(){
  const filas = STATE.filtered.filter(f=>f.cumple === false);
  // "SIN SEGUIMIENTO DIARIO" es un marcador de "no se hizo seguimiento", no una causa
  // raíz real ni un responsable identificable: se excluye del desglose por pedido del usuario.
  const esCausaValida = (valor)=>{
    if(!esNovedadValida(valor)) return false;
    return normalizarTexto(valor) !== "sin seguimiento diario";
  };
  const conMotivo = filas.filter(f=>esCausaValida(f.motivoIncumplimiento));
  const dias = new Set(filas.map(f=>f.fecha ? toInputDate(f.fecha) : null).filter(Boolean));
  const promedioDia = dias.size ? filas.length/dias.size : null;

  const tarjetas = [
    { label:"Pedidos sin cumplimiento", valor:formatoNumero(filas.length), icon:"🔴", color:"danger" },
    { label:"Promedio por día", valor: promedioDia!==null? formatoNumero(promedioDia,1) : "N/D", icon:"📅", color:"warning" },
    { label:"% sobre el total filtrado", valor: STATE.filtered.length? formatoPct(filas.length/STATE.filtered.length*100) : "N/D", icon:"📉", color:"warning" }
  ];
  document.getElementById('kpiSinCumplimiento').innerHTML = tarjetas.map(t=>`
    <div class="card kpi-card hoverable">
      <div class="kpi-top"><span class="kpi-label">${t.label}</span><div class="kpi-icon" style="background:var(--${t.color}-bg); color:var(--${t.color});">${t.icon}</div></div>
      <div class="kpi-value">${t.valor}</div>
    </div>`).join('');

  const colores = estiloEjes();
  const porMotivo = new Map();
  conMotivo.forEach(f=>{ const k = f.motivoIncumplimiento; porMotivo.set(k, (porMotivo.get(k)||0)+1); });
  const motivosOrdenados = [...porMotivo.entries()].sort((a,b)=>b[1]-a[1]);
  crearOActualizarChart('chartMotivoIncumplimiento', {
    type:'bar',
    data:{ labels:motivosOrdenados.map(m=>m[0]), datasets:[{ label:'Pedidos', data:motivosOrdenados.map(m=>m[1]), backgroundColor:colores.danger, borderRadius:4 }] },
    options: opcionesBaseChart(colores, {indexAxis:'y', plugins:{legend:{display:false}}})
  });

  // Los responsables vacíos NO se descartan: se agrupan como "Sin responsable"
  // para que la ausencia de dato sea visible, no invisible.
  const mapaResp = new Map();
  filas.forEach(f=>{
    const k = esNovedadValida(f.responsableIncumplimiento) ? f.responsableIncumplimiento : 'Sin responsable';
    mapaResp.set(k, (mapaResp.get(k)||0)+1);
  });
  const responsablesOrdenados = [...mapaResp.entries()].sort((a,b)=>b[1]-a[1]);
  crearOActualizarChart('chartResponsableIncumplimiento', {
    type:'bar',
    data:{ labels:responsablesOrdenados.map(r=>r[0]), datasets:[{ label:'Pedidos', data:responsablesOrdenados.map(r=>r[1]), backgroundColor:colores.warning, borderRadius:4 }] },
    options: opcionesBaseChart(colores, {indexAxis:'y', plugins:{legend:{display:false}}})
  });
}

function renderTicketPromedio(){
  const f = leerFiltrosActuales();

  // subsetTodos: respeta ciudad/punto pero conserva el punto administrativo
  // (para poder mostrar su información aparte). subset: el conjunto "real"
  // de puntos operativos, usado en todos los promedios y rankings.
  let subsetTodos = STATE.promo;
  if(f.ciudad) subsetTodos = subsetTodos.filter(p=>coincideMultipleNormalizado(p.ciudad, f.ciudad));
  if(f.punto) subsetTodos = subsetTodos.filter(p=>coincideMultipleNormalizado(p.punto, f.punto));
  const subset = subsetTodos.filter(p=>!esPuntoAdministrativo(p.punto));
  // Igual que subset, pero además acotado al rango de fecha filtrado (para
  // que el Ranking y la Tabla comparativa reflejen el mes/rango elegido y no
  // un promedio de todo el histórico).
  const subsetEnRango = subset.filter(p=>mesEnRango(p.anio, p.mes, f.fechaIni, f.fechaFin));

  const nacional = calcularTicketPromedio(STATE.promo, {});
  document.getElementById('ticketNacional').textContent = formatoMoneda(nacional);

  const porMes = new Map();
  subset.forEach(p=>{
    if(p.anio && p.mes && p.ticket !== null){
      const key = `${p.anio}-${String(p.mes).padStart(2,'0')}`;
      if(!porMes.has(key)) porMes.set(key, []);
      porMes.get(key).push(p.ticket);
    }
  });
  const colores = estiloEjes();
  // Siempre se muestran los 12 meses del año (Enero–Diciembre), con hueco en
  // los meses sin datos, para poder ver de un vistazo en qué mes estamos y
  // qué tan avanzado va el año — no solo los meses que ya tienen información.
  const etiquetasMeses12 = MESES_PROMO.map(m => m.nombre.charAt(0) + m.nombre.slice(1).toLowerCase());
  const valoresMes12 = MESES_PROMO.map(m=>{
    const key = `${CONFIG.ANIO_PROMO}-${String(m.num).padStart(2,'0')}`;
    const arr = porMes.get(key);
    return arr && arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : null;
  });
  crearOActualizarChart('chartTicketMensual', {
    type:'line',
    data:{ labels:etiquetasMeses12, datasets:[{ label:'Ticket promedio', data:valoresMes12, borderColor:colores.accent, backgroundColor:'transparent', tension:.35, borderWidth:2.5, spanGaps:true }] },
    plugins:[pluginEtiquetasValor],
    options: opcionesBaseChart(colores, {plugins:{legend:{display:false}}, layout:{padding:{top:20}}})
  });

  const porPunto = new Map();
  subsetEnRango.forEach(p=>{
    if(p.ticket !== null){
      if(!porPunto.has(p.punto)) porPunto.set(p.punto, []);
      porPunto.get(p.punto).push(p.ticket);
    }
  });
  const rankingPuntos = [...porPunto.entries()].map(([nombre, arr])=>({nombre, valor: arr.reduce((a,b)=>a+b,0)/arr.length}))
    .sort((a,b)=>b.valor-a.valor);

  // Ticket promedio de los puntos filtrados: como subsetEnRango ya respeta
  // los filtros de ciudad/punto, rankingPuntos ya representa exactamente esa
  // selección. Si no hay ningún filtro activo, se limita a los 10 principales
  // para que el gráfico siga siendo legible.
  const hayFiltroActivo = (f.ciudad && f.ciudad.length) || (f.punto && f.punto.length);
  const datosFiltrados = hayFiltroActivo ? rankingPuntos : rankingPuntos.slice(0,10);
  crearOActualizarChart('chartTicketFiltrados', {
    type:'bar',
    data:{ labels:datosFiltrados.map(p=>p.nombre), datasets:[{ label:'Ticket promedio', data:datosFiltrados.map(p=>Math.round(p.valor)), backgroundColor:colores.accentStrong, borderRadius:4 }] },
    options: opcionesBaseChart(colores, {indexAxis:'y', plugins:{legend:{display:false}}})
  });
  document.getElementById('rankTicketPunto').innerHTML = listaRankingHTML(rankingPuntos, 10, 'moneda');

  const filasTabla = [...porPunto.entries()].map(([punto, arr])=>{
    const primero = subsetEnRango.find(p=>p.punto===punto);
    return { punto, ciudad: primero? primero.ciudad : '', promedio: arr.reduce((a,b)=>a+b,0)/arr.length, registros: arr.length, administrativo:false };
  }).sort((a,b)=>b.promedio-a.promedio);

  // El punto administrativo se cuenta y se muestra, pero NUNCA entra al
  // ranking ni al promedio: se agrega como fila final, marcada aparte.
  const adminEnRango = subsetTodos.filter(p=>esPuntoAdministrativo(p.punto) && mesEnRango(p.anio, p.mes, f.fechaIni, f.fechaFin) && p.ticket !== null);
  if(adminEnRango.length){
    const promedioAdmin = adminEnRango.reduce((s,p)=>s+p.ticket,0)/adminEnRango.length;
    filasTabla.push({ punto: adminEnRango[0].punto, ciudad: adminEnRango[0].ciudad, promedio: promedioAdmin, registros: adminEnRango.length, administrativo:true });
  }

  document.getElementById('tablaTicket').innerHTML = filasTabla.length ? `
    <table class="data-table"><thead><tr><th>Punto</th><th>Ciudad</th><th>Ticket promedio</th><th>Registros</th><th></th></tr></thead><tbody>
      ${filasTabla.map(r=>`<tr${r.administrativo?' style="opacity:.7;"':''}><td>${r.punto}</td><td>${r.ciudad}</td><td class="num">${formatoMoneda(r.promedio)}</td><td class="num">${formatoNumero(r.registros)}</td><td>${r.administrativo?'<span class="badge yellow">Administrativo · no promediado</span>':''}</td></tr>`).join('')}
    </tbody></table>` : `<div class="empty-note">Sin datos de la hoja Promoción de Entradas.</div>`;

  // Per Cápita: costo fijo del punto / total de servicios del año (columna Total general)
  // Se excluye también el punto administrativo del cálculo de eficiencia, por la
  // misma razón: su "costo por servicio" no es comparable (1 servicio/mes ficticio).
  let resumen = STATE.promoResumen || [];
  if(f.ciudad) resumen = resumen.filter(r=>coincideMultipleNormalizado(r.ciudad, f.ciudad));
  if(f.punto) resumen = resumen.filter(r=>coincideMultipleNormalizado(r.punto, f.punto));
  const conPerCapita = resumen.filter(r=>r.costoPorServicio !== null && !esPuntoAdministrativo(r.punto)).sort((a,b)=>a.costoPorServicio-b.costoPorServicio);
  const adminResumen = resumen.filter(r=>esPuntoAdministrativo(r.punto));
  document.getElementById('tablaPerCapita').innerHTML = (conPerCapita.length || adminResumen.length) ? `
    <table class="data-table"><thead><tr><th>Punto</th><th>Ciudad</th><th>Clasificación</th><th>Mensajeros</th><th>Costo</th><th>Servicios (año)</th><th>Per Cápita</th><th></th></tr></thead><tbody>
      ${conPerCapita.map(r=>`
        <tr>
          <td>${r.punto}</td><td>${r.ciudad}</td><td>${r.clasificacion||'N/D'}</td>
          <td class="num">${r.mensajeros!==null?formatoNumero(r.mensajeros,1):'N/D'}</td>
          <td class="num">${formatoMoneda(r.costo)}</td>
          <td class="num">${formatoNumero(r.totalGeneral)}</td>
          <td class="num">${formatoMoneda(r.costoPorServicio)}</td>
          <td></td>
        </tr>`).join('')}
      ${adminResumen.map(r=>`
        <tr style="opacity:.7;">
          <td>${r.punto}</td><td>${r.ciudad}</td><td>${r.clasificacion||'N/D'}</td>
          <td class="num">${r.mensajeros!==null?formatoNumero(r.mensajeros,1):'N/D'}</td>
          <td class="num">${formatoMoneda(r.costo)}</td>
          <td class="num">${formatoNumero(r.totalGeneral)}</td>
          <td class="num">${formatoMoneda(r.costoPorServicio)}</td>
          <td><span class="badge yellow">Administrativo · no promediado</span></td>
        </tr>`).join('')}
    </tbody></table>` : `<div class="empty-note">Sin datos de Mensajeros/Costo en la hoja Promoción de Entradas.</div>`;
}

/* ---------------------------------------------------------------
   17. RENDER — MÓDULO 10: RANKING NACIONAL
   --------------------------------------------------------------- */

  const ciudades = agregarPor(filas,'ciudad').sort((a,b)=>b.total-a.total).map(a=>({nombre:a.nombre, valor:a.total}));
  document.getElementById('rankCiudades').innerHTML = listaRankingHTML(ciudades, 8);

  const puntos = agregarPor(filas,'punto').sort((a,b)=>b.total-a.total).map(a=>({nombre:a.nombre, valor:a.total}));

/* ---------------------------------------------------------------
   18. RENDER — MÓDULO 11: CENTRO DE ALERTAS
   --------------------------------------------------------------- */
function renderAlertas(){
  const filas = STATE.filtered;
  const m = calcularMetricas(filas);
  const porCiudad = agregarPor(filas,'ciudad').filter(a=>a.total>0);
  const porPunto = agregarPor(filas,'punto').filter(a=>a.total>0);
  const porResp = agregarPor(filas,'responsable').filter(a=>a.total>0);
  const porFranja = agregarPor(filas,'franja').filter(a=>a.total>0);

  const alertas = [];

  if(m.cumplimiento !== null && m.cumplimiento < CONFIG.UMBRAL_CUMPLIMIENTO){
    alertas.push({icon:'🔴', texto:`El cumplimiento general es de <b>${formatoPct(m.cumplimiento)}</b>, por debajo del umbral mínimo de ${CONFIG.UMBRAL_CUMPLIMIENTO}%.`});
  }
  const ciudadPeorTiempo = porCiudad.filter(c=>c.tiempoProm!==null).sort((a,b)=>b.tiempoProm-a.tiempoProm)[0];
  if(ciudadPeorTiempo){
    alertas.push({icon:'🟠', texto:`<b>${ciudadPeorTiempo.nombre}</b> presenta el mayor tiempo promedio de entrega: ${formatoNumero(ciudadPeorTiempo.tiempoProm,0)} min.`});
  }
  const puntoMasNovedades = porPunto.sort((a,b)=>b.novedadesCount-a.novedadesCount)[0];
  if(puntoMasNovedades && puntoMasNovedades.novedadesCount>0){
    alertas.push({icon:'🟠', texto:`El punto <b>${puntoMasNovedades.nombre}</b> concentra la mayor cantidad de novedades: ${formatoNumero(puntoMasNovedades.novedadesCount)}.`});
  }
  const respMasIncidencias = porResp.sort((a,b)=>b.novedadesCount-a.novedadesCount)[0];
  if(respMasIncidencias && respMasIncidencias.novedadesCount>0){
    alertas.push({icon:'🟡', texto:`<b>${respMasIncidencias.nombre}</b> es el responsable con mayor cantidad de incidencias registradas: ${formatoNumero(respMasIncidencias.novedadesCount)}.`});
  }
  const franjaPeorDesempeno = porFranja.filter(f=>f.cumplimiento!==null).sort((a,b)=>a.cumplimiento-b.cumplimiento)[0];
  if(franjaPeorDesempeno){
    alertas.push({icon:'🟡', texto:`La franja <b>${franjaPeorDesempeno.nombre}</b> presenta el desempeño más bajo, con un cumplimiento de ${formatoPct(franjaPeorDesempeno.cumplimiento)}.`});
  }
  const ciudadMejorCumplimiento = porCiudad.filter(c=>c.cumplimiento!==null && c.total>=3).sort((a,b)=>b.cumplimiento-a.cumplimiento)[0];
  if(ciudadMejorCumplimiento){
    alertas.push({icon:'🟢', texto:`<b>${ciudadMejorCumplimiento.nombre}</b> muestra el mejor cumplimiento: ${formatoPct(ciudadMejorCumplimiento.cumplimiento)}.`});
  }
  const puntoMejorDesempeno = porPunto.filter(p=>p.cumplimiento!==null && p.total>=3).sort((a,b)=>b.cumplimiento-a.cumplimiento)[0];
  if(puntoMejorDesempeno){
    alertas.push({icon:'🟢', texto:`El punto con mejor desempeño es <b>${puntoMejorDesempeno.nombre}</b>, con ${formatoPct(puntoMejorDesempeno.cumplimiento)} de cumplimiento.`});
  }

  document.getElementById('panelAlertas').innerHTML = alertas.length ? alertas.map(a=>`
    <div class="alert-item"><span class="a-icon">${a.icon}</span><span class="a-text">${a.texto}</span></div>`).join('')
    : `<div class="empty-note">No se generaron alertas para los filtros seleccionados.</div>`;
}

/* ---------------------------------------------------------------
   19. RENDER — MÓDULO 12: INSIGHTS DEL DÍA
   --------------------------------------------------------------- */
function renderInsights(){
  const filas = STATE.filtered;
  const m = calcularMetricas(filas);
  const mAnt = calcularMetricas(STATE.previousPeriod);
  const insights = [];

  const varCumplimiento = calcularVariacion(m.cumplimiento, mAnt.cumplimiento);
  if(varCumplimiento !== null){
    insights.push(`El cumplimiento ${varCumplimiento>=0?'aumentó':'disminuyó'} ${formatoPct(Math.abs(varCumplimiento))} frente al período anterior.`);
  }
  const porCiudad = agregarPor(filas,'ciudad').filter(c=>c.total>=3 && c.cumplimiento!==null).sort((a,b)=>b.cumplimiento-a.cumplimiento);
  if(porCiudad.length){
    insights.push(`${porCiudad[0].nombre} presenta el mejor desempeño, con ${formatoPct(porCiudad[0].cumplimiento)} de cumplimiento.`);
  }
  const porFranja = agregarPor(filas,'franja').filter(f=>f.total>0).sort((a,b)=>b.total-a.total);
  if(porFranja.length){
    insights.push(`La franja ${porFranja[0].nombre} concentra la mayor cantidad de servicios (${formatoNumero(porFranja[0].total)}).`);
  }
  const f = leerFiltrosActuales();
  const porPuntoTicket = new Map();
  STATE.promo.forEach(p=>{ if(p.ticket!==null){ if(!porPuntoTicket.has(p.punto)) porPuntoTicket.set(p.punto, []); porPuntoTicket.get(p.punto).push(p.ticket); } });
  const rankingTicket = [...porPuntoTicket.entries()].map(([nombre,arr])=>({nombre, valor:arr.reduce((a,b)=>a+b,0)/arr.length})).sort((a,b)=>b.valor-a.valor);
  if(rankingTicket.length){
    insights.push(`El punto con mayor ticket promedio es ${rankingTicket[0].nombre}, con ${formatoMoneda(rankingTicket[0].valor)}.`);
  }
  const varNovedades = calcularVariacion(m.novedadesCount, mAnt.novedadesCount);
  if(varNovedades !== null){
    insights.push(`Las novedades ${varNovedades<=0?'disminuyeron':'aumentaron'} ${formatoPct(Math.abs(varNovedades))} frente al período anterior.`);
  }
  const varTiempo = calcularVariacion(m.tiempoProm, mAnt.tiempoProm);
  if(varTiempo !== null){
    insights.push(`El tiempo promedio de entrega ${varTiempo<=0?'mejoró':'aumentó'} ${formatoPct(Math.abs(varTiempo))} respecto al período anterior.`);
  }

  document.getElementById('panelInsights').innerHTML = insights.length ? insights.map(txt=>`
    <div class="insight-item">💡&nbsp; ${txt}</div>`).join('')
    : `<div class="empty-note">No hay suficiente información para generar insights con los filtros actuales.</div>`;
}

/* ---------------------------------------------------------------
   20. MÓDULO 11 — MAPA NACIONAL DE SERVICIOS
   --------------------------------------------------------------- */
function inicializarMapa(){
  STATE.map = L.map('mapContainer', { zoomControl:true, preferCanvas:true }).setView([4.6, -74.1], 6);
  STATE.tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap', maxZoom:18
  }).addTo(STATE.map);
  aplicarFiltroTilesSegunTema();

  // El contenedor del mapa puede no tener aún un tamaño real (ancho/alto en
  // píxeles) en el instante exacto en que se crea el mapa, ya que el navegador
  // todavía está calculando el layout de la página. Si esto ocurre, el plugin
  // de heatmap intenta medir un canvas de 0px y falla con IndexSizeError,
  // dejando el mapa en un estado roto (y sus controles sin responder). Se
  // fuerza un recálculo de tamaño de inmediato y otro poco después, como red
  // de seguridad adicional para layouts que tardan más en asentarse.
  STATE.map.invalidateSize();
  setTimeout(()=>{ if(STATE.map) STATE.map.invalidateSize(); }, 300);
  window.addEventListener('resize', ()=>{ if(STATE.map) STATE.map.invalidateSize(); });

  STATE.layers.cluster = L.markerClusterGroup({ disableClusteringAtZoom: 16, chunkedLoading:true });
  STATE.map.on('moveend', ()=> recalcularCobertura());

  STATE.map.on('click', (e)=>{
    if(STATE.mapMode !== 'markers') return;
    establecerCentroCobertura(e.latlng.lat, e.latlng.lng);
  });

  document.getElementById('mapModeToggle').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-mode]');
    if(!btn) return;
    STATE.mapMode = btn.dataset.mode;
    document.querySelectorAll('#mapModeToggle button').forEach(b=>b.classList.toggle('active', b===btn));
    renderMapa();
  });

  document.getElementById('radioToggle').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-radio]');
    if(!btn) return;
    STATE.coverageRadiusKm = parseFloat(btn.dataset.radio);
    document.querySelectorAll('#radioToggle button').forEach(b=>b.classList.toggle('active', b===btn));
    recalcularCobertura();
  });

  document.getElementById('mapCitySelect').addEventListener('change', (e)=>{
    const ciudad = e.target.value;
    if(!ciudad) return;
    const puntos = STATE.filtered.filter(f=>f.ciudad===ciudad && f.lat!==null && f.lon!==null);
    if(!puntos.length) return;
    const centLat = puntos.reduce((s,p)=>s+p.lat,0)/puntos.length;
    const centLon = puntos.reduce((s,p)=>s+p.lon,0)/puntos.length;
    STATE.map.setView([centLat, centLon], 12);
    establecerCentroCobertura(centLat, centLon);
  });
}

function aplicarFiltroTilesSegunTema(){
  const tileEl = document.querySelector('#mapContainer .leaflet-tile-pane');
  if(tileEl) tileEl.style.filter = getComputedStyle(document.documentElement).getPropertyValue('--map-tile-filter');
}

function establecerCentroCobertura(lat, lon){
  STATE.coverageCenter = {lat, lon};
  if(STATE.layers.coverageCircle){ STATE.map.removeLayer(STATE.layers.coverageCircle); }
  if(STATE.layers.coverageCenterMarker){ STATE.map.removeLayer(STATE.layers.coverageCenterMarker); }
  STATE.layers.coverageCenterMarker = L.circleMarker([lat,lon], {radius:6, color:'#fff', weight:2, fillColor:'#D13438', fillOpacity:1}).addTo(STATE.map);
  STATE.layers.coverageCircle = L.circle([lat,lon], { radius: STATE.coverageRadiusKm*1000, color:'#0F6CBD', weight:2, fillColor:'#0F6CBD', fillOpacity:0.12 }).addTo(STATE.map);
  recalcularCobertura();
}

function recalcularCobertura(){
  if(!STATE.coverageCenter){ return; }
  const {lat, lon} = STATE.coverageCenter;
  if(STATE.layers.coverageCircle) STATE.layers.coverageCircle.setRadius(STATE.coverageRadiusKm*1000);

  const dentro = STATE.filtered.filter(f=>{
    if(f.lat===null || f.lon===null) return false;
    return haversineKm(lat, lon, f.lat, f.lon) <= STATE.coverageRadiusKm;
  });
  const m = calcularMetricas(dentro);
  const ciudadesEnRadio = new Set(dentro.map(d=>normalizarTexto(d.ciudad)));
  let ticketProm = null;
  if(ciudadesEnRadio.size){
    const relevantes = STATE.promo.filter(p=>ciudadesEnRadio.has(normalizarTexto(p.ciudad)));
    ticketProm = calcularTicketPromedio(relevantes, {});
  }

  document.getElementById('coverageStats').innerHTML = `
    <div class="coverage-metric"><span>Servicios en el radio</span><b>${formatoNumero(m.total)}</b></div>
    <div class="coverage-metric"><span>Tiempo promedio</span><b>${m.tiempoProm!==null?formatoNumero(m.tiempoProm,0)+' min':'N/D'}</b></div>
    <div class="coverage-metric"><span>Cumplimiento</span><b>${formatoPct(m.cumplimiento)}</b></div>
    <div class="coverage-metric"><span>Efectividad</span><b>${formatoPct(m.efectividad)}</b></div>
    <div class="coverage-metric"><span>Novedades</span><b>${formatoNumero(m.novedadesCount)}</b></div>
    <div class="coverage-metric"><span>Ticket promedio</span><b>${ticketProm!==null?formatoMoneda(ticketProm):'N/D'}</b></div>
  `;
}

function renderMapa(){
  if(typeof L === 'undefined'){
    const mapCard = document.getElementById('mapContainer');
    if(mapCard) mapCard.innerHTML = '<div class="empty-note">⚠ La librería de mapas (Leaflet) no se pudo cargar desde el CDN.</div>';
    return;
  }
  const contenedorMapa = document.getElementById('mapContainer');
  if(!contenedorMapa || contenedorMapa.offsetParent === null){
    // La carpeta "Mapa de Calor" no está activa en este momento (el módulo
    // está oculto con display:none). Inicializar Leaflet dentro de un
    // contenedor oculto lo deja en un estado roto de forma permanente, así
    // que se difiere: el mapa se construye correctamente la primera vez que
    // el usuario realmente abre esa carpeta.
    return;
  }
  if(!STATE.map) inicializarMapa();
  // Se fuerza el recálculo de tamaño en cada render (operación barata) para
  // evitar que cualquier capa (heatmap, cluster) mida el contenedor en 0px
  // si el layout de la página cambió entre un render y otro.
  STATE.map.invalidateSize();
  const conCoordenadas = STATE.filtered.filter(f => typeof f.lat === 'number' && typeof f.lon === 'number' && !isNaN(f.lat) && !isNaN(f.lon) && Math.abs(f.lat)<=90 && Math.abs(f.lon)<=180);

  if(STATE.layers.heat){ STATE.map.removeLayer(STATE.layers.heat); STATE.layers.heat = null; }
  if(STATE.map.hasLayer(STATE.layers.cluster)) STATE.map.removeLayer(STATE.layers.cluster);
  STATE.layers.cluster.clearLayers();

  if(STATE.mapMode === 'heat'){
    const puntosHeat = conCoordenadas.map(f=>[f.lat, f.lon, 0.55]);
    const opcionesHeat = {
      radius:22, blur:18, maxZoom:12,
      gradient:{0.2:'#0F6CBD', 0.4:'#0F9D58', 0.65:'#F2A600', 1.0:'#D13438'}
    };
    const contenedor = document.getElementById('mapContainer');
    const tieneAncho = contenedor && contenedor.clientWidth > 0 && contenedor.clientHeight > 0;
    if(!tieneAncho){
      // El contenedor todavía no tiene un tamaño real: se reintenta en el
      // siguiente frame en vez de dejar que el plugin falle con IndexSizeError.
      requestAnimationFrame(()=>{ if(STATE.mapMode === 'heat'){ STATE.map.invalidateSize(); renderMapa(); } });
      return;
    }
    try{
      STATE.layers.heat = L.heatLayer(puntosHeat, opcionesHeat).addTo(STATE.map);
    }catch(err){
      console.warn("No se pudo dibujar el heatmap, reintentando tras recalcular tamaño:", err.message || err);
      STATE.map.invalidateSize();
      setTimeout(()=>{ if(STATE.mapMode === 'heat') renderMapa(); }, 200);
      return;
    }
  } else {
    conCoordenadas.forEach(f=>{
      const marker = L.circleMarker([f.lat, f.lon], {
        radius:6, weight:1, color:'#fff',
        fillColor: f.cumple===false ? '#D13438' : (f.cumple===true ? '#0F9D58' : '#0F6CBD'),
        fillOpacity:0.9
      });
      marker.bindPopup(crearPopupHTML(f));
      marker.on('click', ()=> establecerCentroCobertura(f.lat, f.lon));
      STATE.layers.cluster.addLayer(marker);
    });
    STATE.map.addLayer(STATE.layers.cluster);
  }

  const ciudades = new Set(conCoordenadas.map(f=>f.ciudad).filter(Boolean));
  document.getElementById('mapStatsBar').innerHTML = `
    <div class="map-stat"><b class="num">${formatoNumero(conCoordenadas.length)}</b>Servicios visualizados</div>
    <div class="map-stat"><b class="num">${formatoNumero(conCoordenadas.length)}</b>Puntos geolocalizados</div>
    <div class="map-stat"><b class="num">${formatoNumero(ciudades.size)}</b>Ciudades representadas</div>
    <div class="map-stat"><b class="num">${STATE.filtered.length ? formatoPct(conCoordenadas.length/STATE.filtered.length*100,0) : '0%'}</b>Cobertura de geolocalización</div>
  `;
  recalcularCobertura();
}

   --------------------------------------------------------------- */
function filasTablaFiltradasOrdenadas(){
  const { sortField, sortDir, search } = STATE.tableState;
  let filas = STATE.filtered;
  if(search){
    const s = normalizarTexto(search);
    filas = filas.filter(f =>
      normalizarTexto(f.guia).includes(s) || normalizarTexto(f.ciudad).includes(s) ||
      normalizarTexto(f.punto).includes(s) || normalizarTexto(f.responsable).includes(s) ||
      normalizarTexto(f.estado).includes(s) || normalizarTexto(f.novedad).includes(s)
    );
  }
  const copia = [...filas];
  copia.sort((a,b)=>{
    let va = a[sortField], vb = b[sortField];
    if(sortField==='fecha'){ va = va? va.getTime():0; vb = vb? vb.getTime():0; }
    if(sortField==='cumple'){ va = va===true?1:(va===false?0:-1); vb = vb===true?1:(vb===false?0:-1); }
    if(typeof va === 'string') va = normalizarTexto(va);
    if(typeof vb === 'string') vb = normalizarTexto(vb);
    if(va===null||va===undefined) va = sortDir==='asc'? Infinity : -Infinity;
    if(vb===null||vb===undefined) vb = sortDir==='asc'? Infinity : -Infinity;
    if(va<vb) return sortDir==='asc'? -1:1;
    if(va>vb) return sortDir==='asc'? 1:-1;
    return 0;
  });
  return copia;
}

function renderTablaOperativa(){
  const filas = filasTablaFiltradasOrdenadas();
  const totalPaginas = Math.max(1, Math.ceil(filas.length / CONFIG.PAGINA_TABLA));
  STATE.tableState.page = Math.min(STATE.tableState.page, totalPaginas);
  const inicio = (STATE.tableState.page-1)*CONFIG.PAGINA_TABLA;
  const pagina = filas.slice(inicio, inicio+CONFIG.PAGINA_TABLA);

  document.getElementById('tablaOperativaBody').innerHTML = pagina.length ? pagina.map(f=>{
    const nivel = f.cumple===true?'green':(f.cumple===false?'red':'yellow');
    const texto = f.cumple===true?'Cumple':(f.cumple===false?'No cumple':'N/D');
    return `<tr>
      <td class="num">${f.fechaTexto || 'N/D'}</td>
      <td>${f.guia || 'N/D'}</td>
      <td>${f.ciudad || 'N/D'}</td>
      <td>${f.punto || 'N/D'}</td>
      <td>${f.responsable || 'N/D'}</td>
      <td>${f.estado || 'N/D'}</td>
      <td><span class="badge ${nivel}">${texto}</span></td>
      <td class="num">${f.tiempo!==null? f.tiempo+' min':'N/D'}</td>
      <td>${f.novedad || 'Ninguna'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="9" class="empty-note">No se encontraron registros.</td></tr>`;

  document.getElementById('tablaPaginacion').innerHTML = `
    <button id="btnPagAnt" ${STATE.tableState.page<=1?'disabled':''}>‹ Anterior</button>
    <span>Página ${STATE.tableState.page} de ${totalPaginas} · ${formatoNumero(filas.length)} registros</span>
    <button id="btnPagSig" ${STATE.tableState.page>=totalPaginas?'disabled':''}>Siguiente ›</button>
  `;
  const btnAnt = document.getElementById('btnPagAnt');
  const btnSig = document.getElementById('btnPagSig');
  if(btnAnt) btnAnt.addEventListener('click', ()=>{ STATE.tableState.page--; renderTablaOperativa(); });
  if(btnSig) btnSig.addEventListener('click', ()=>{ STATE.tableState.page++; renderTablaOperativa(); });

  document.querySelectorAll('#tablaOperativa th[data-field]').forEach(th=>{
    const campo = th.dataset.field;
    th.textContent = th.textContent.replace(/ ▲| ▼/g,'') + (STATE.tableState.sortField===campo ? (STATE.tableState.sortDir==='asc'?' ▲':' ▼') : '');
  });
}

function construirTabs(){
  const nav = document.getElementById('folderNav');
  nav.innerHTML = CARPETAS_CONFIG.map((carpeta, idxCarpeta) => `
    <button class="folder-header" data-carpeta-id="${idxCarpeta}">

// Muestra TODOS los módulos que pertenecen a la carpeta seleccionada, uno
// debajo del otro en la misma vista (ej. la carpeta "Operación" muestra
// Comportamiento, Cumplimiento, Productividad y Tipo de Negocio juntos),
// en vez de navegar módulo por módulo dentro de la carpeta.
function mostrarCarpeta(idxCarpeta){
  STATE.carpetaActual = idxCarpeta;
  const carpeta = CARPETAS_CONFIG[idxCarpeta];
  if(!carpeta) return;

  document.querySelectorAll('#mainContent .module').forEach(sec=>{
    const id = parseInt(sec.dataset.tab, 10);
    sec.classList.toggle('tab-activa', carpeta.modulos.includes(id));
  });
  document.querySelectorAll('#folderNav .folder-header').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.carpetaId,10) === idxCarpeta);
  });

  // Se vuelven a renderizar todos los módulos de la carpeta: garantiza que
  // gráficos (Chart.js) y el mapa (Leaflet) midan correctamente su contenedor
  // ahora que son visibles, en vez de quedar con tamaño 0 por haberse
  // dibujado mientras estaban ocultos.
  carpeta.modulos.forEach(id=>{
    const modulo = MODULOS_CONFIG.find(m => m.id === id);
    if(modulo){
      try{ modulo.fn(); }catch(err){ console.error(`Error renderizando el módulo "${modulo.nombre}":`, err); }
    }
  });

  document.getElementById('mainContent').scrollIntoView({block:'start', behavior:'instant'});
  // En pantallas angostas, seleccionar una carpeta cierra la barra lateral.
  if(window.innerWidth <= 1100){
    document.getElementById('sidebar').classList.remove('abierta');
  }
}

// Calcula fechaIni/fechaFin para cada preset y los aplica a los campos de fecha.
function aplicarPresetFecha(tipo){
  if(tipo === 'personalizado') return; // el usuario está editando las fechas a mano, no se toca nada
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  let ini = new Date(hoy), fin = new Date(hoy);

  if(tipo === 'hoy'){ /* ini=fin=hoy */ }
  else if(tipo === 'ayer'){ ini.setDate(ini.getDate()-1); fin.setDate(fin.getDate()-1); }
  else if(tipo === '7d'){ ini.setDate(ini.getDate()-6); }
  else if(tipo === '15d'){ ini.setDate(ini.getDate()-14); }
  else if(tipo === '30d'){ ini.setDate(ini.getDate()-29); }
  else if(tipo === 'mesActual'){ ini = new Date(hoy.getFullYear(), hoy.getMonth(), 1); fin = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0); }
  else if(tipo === 'mesAnterior'){ ini = new Date(hoy.getFullYear(), hoy.getMonth()-1, 1); fin = new Date(hoy.getFullYear(), hoy.getMonth(), 0); }
  else if(tipo === 'anioActual'){ ini = new Date(hoy.getFullYear(), 0, 1); fin = new Date(hoy.getFullYear(), 11, 31); }
  else if(tipo === 'todo'){
    const fechasValidas = STATE.data.map(d=>d.fecha).filter(Boolean);
    if(fechasValidas.length){ ini = new Date(Math.min(...fechasValidas)); fin = new Date(Math.max(...fechasValidas)); }
  }

  document.getElementById('fFechaIni').value = toInputDate(ini);
  document.getElementById('fFechaFin').value = toInputDate(fin);
  aplicarFiltros();
}

function conectarEventos(){
  document.getElementById('btnAplicar').addEventListener('click', aplicarFiltros);
  document.getElementById('btnLimpiar').addEventListener('click', limpiarFiltros);
  document.getElementById('fRangoRapido').addEventListener('change', (e)=>{
    aplicarPresetFecha(e.target.value);
  });
  ['fFechaIni','fFechaFin'].forEach(id=>{
    document.getElementById(id).addEventListener('input', ()=>{
      document.getElementById('fRangoRapido').value = 'personalizado';
    });
  });
  document.getElementById('btnToggleSidebar').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('abierta');
  });
  document.getElementById('btnActualizar').addEventListener('click', async ()=>{
    document.getElementById('loadingScreen').classList.remove('hidden');
    setLoaderProgress(20, "Actualizando datos…");
    try{
      await cargarDatos();
      poblarFiltros();
      construirLayout();
      construirTabs();
      poblarFiltros();
      conectarEventos();
      aplicarFiltros();
      mostrarCarpeta(STATE.carpetaActual !== undefined ? STATE.carpetaActual : 0);
      marcarUltimaActualizacion();
      setLoaderProgress(100, "Actualizado");
    }catch(err){
      console.error("Error actualizando datos:", err);
      mostrarErrorFatal(err.message || err);
    }finally{
      setTimeout(ocultarPantallaCarga, 300);
    }
  });

  document.getElementById('tablaBuscar').addEventListener('input', debounce((e)=>{
    STATE.tableState.search = e.target.value;
    STATE.tableState.page = 1;
    renderTablaOperativa();
  }, 250));

  document.querySelectorAll('#tablaOperativa th[data-field]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const campo = th.dataset.field;
      if(STATE.tableState.sortField === campo){
        STATE.tableState.sortDir = STATE.tableState.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        STATE.tableState.sortField = campo;
        STATE.tableState.sortDir = 'asc';
      }
      renderTablaOperativa();
    });
  });

  document.getElementById('btnExportExcel').addEventListener('click', exportarExcel);
  document.getElementById('btnExportPDF').addEventListener('click', exportarPDF);
  document.getElementById('btnImprimir').addEventListener('click', imprimirTabla);
}

function ocultarPantallaCarga(){
  const pantalla = document.getElementById('loadingScreen');
  if(pantalla) pantalla.classList.add('hidden');
}

function mostrarErrorFatal(mensaje){
  const main = document.getElementById('mainContent') || document.body;
  const div = document.createElement('div');
  div.className = 'demo-banner';
  div.style.margin = '24px 0';
  div.innerHTML = `⚠ Ocurrió un error inesperado construyendo el dashboard: <b>${mensaje}</b>. Revise la consola del navegador (F12) para más detalle.`;
  main.prepend(div);
}

async function iniciarAplicacion(){
  try{
    actualizarFechaEncabezado();
    inicializarTema();
    setLoaderProgress(5, "Iniciando Torre de Control Operativa…");
    await cargarDatos();
    construirLayout();
    construirTabs();
    poblarFiltros();
    conectarEventos();
    try{
      aplicarFiltros();
    }catch(errRender){
      console.error("Error renderizando los módulos:", errRender);
      mostrarErrorFatal(errRender.message || errRender);
    }
    mostrarCarpeta(0);
    marcarUltimaActualizacion();
    setLoaderProgress(100, "Listo");
    validarDashboard();
  }catch(errFatal){
    console.error("Error fatal iniciando la aplicación:", errFatal);
    construirLayout();
    construirTabs();
    mostrarCarpeta(0);
    mostrarErrorFatal(errFatal.message || errFatal);
  }finally{
    setTimeout(ocultarPantallaCarga, 350);
  }
}

// Red de seguridad: cualquier excepción no controlada en cualquier punto de la
// aplicación libera la pantalla de carga en vez de dejarla bloqueada para siempre.
window.addEventListener('error', ()=> ocultarPantallaCarga(), true);
window.addEventListener('unhandledrejection', ()=> ocultarPantallaCarga());

document.addEventListener('DOMContentLoaded', iniciarAplicacion);
</script>
